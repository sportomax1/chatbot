<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19">
<title>Gemini Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#080d19;--panel:#0f1728;--panel2:#151f35;--text:#f7f8fb;--muted:#98a3b8;--line:#24314a;--a:#7c5cff;--b:#4aa8ff;--shadow:0 24px 70px #0006}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 70% 0%,#5b4aff22,transparent 32%),var(--bg);color:var(--text)}button,textarea,select{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:280px 1fr;overflow:hidden}.sidebar{border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:20px;background:#070c18c7;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--b),var(--a));display:grid;place-items:center;box-shadow:0 10px 30px #7c5cff55}.brand strong{display:block}.brand span,.sub,.hint{color:var(--muted);font-size:12px}.new,.send{border:0;background:linear-gradient(135deg,var(--b),var(--a));font-weight:700;cursor:pointer;box-shadow:0 12px 28px #7c5cff3d}.new{padding:13px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px}.nav{display:grid;gap:6px}.nav button,.mode{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;display:flex;gap:10px;align-items:center;cursor:pointer}.nav button.active,.nav button:hover,.mode.active{background:var(--panel2);color:var(--text)}.history{min-height:0;display:flex;flex-direction:column;gap:9px}.history h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 8px}.history-list{overflow:auto;display:grid;gap:5px}.history-item{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-item:hover{background:var(--panel);color:var(--text)}.foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#253653,#3b2c67);font-weight:700}.user span{display:block;color:var(--muted);font-size:12px}.main{min-width:0;display:flex;flex-direction:column}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#080d19b8;backdrop-filter:blur(18px)}.title h1{font-size:20px;margin:0}.title p{font-size:13px;margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;cursor:pointer}.icon:hover{background:var(--panel2)}.workspace{flex:1;min-height:0;display:flex;max-width:1050px;width:100%;margin:auto}.messages{flex:1;overflow:auto;padding:34px 28px 160px;scroll-behavior:smooth}.empty{min-height:100%;display:grid;place-items:center}.empty-inner{max-width:720px;text-align:center}.orb{width:72px;height:72px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#4aa8ff33,#7c5cff40);border:1px solid #7c5cff66;box-shadow:0 20px 70px #6454ff2e}.empty h2{font-size:38px;letter-spacing:-.04em;margin:0 0 12px}.empty p{color:var(--muted);line-height:1.7;margin:0 auto 26px}.starters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.starter{border:1px solid var(--line);background:#0f1728b3;border-radius:16px;padding:16px;text-align:left;color:var(--muted);cursor:pointer}.starter:hover{transform:translateY(-2px);border-color:#4b5d86;color:var(--text);background:var(--panel2)}.msg{display:flex;gap:14px;margin-bottom:28px;animation:in .18s ease-out}.msg.user-msg{flex-direction:row-reverse}.bubble{max-width:min(780px,85%);padding:15px 17px;border-radius:18px;line-height:1.65;overflow-wrap:anywhere}.user-msg .bubble{background:linear-gradient(135deg,#31365f,#472d72);border-bottom-right-radius:6px}.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}.bubble pre{overflow:auto;background:#090e19;border:1px solid var(--line);padding:14px;border-radius:12px}.generated{max-width:100%;display:block;border-radius:14px;margin-top:10px}.msg-actions{display:flex;gap:6px;margin-top:10px}.small{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 9px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}.small:hover{color:var(--text);background:var(--panel2)}.composer-wrap{position:absolute;left:280px;right:0;bottom:0;padding:18px 28px 24px;background:linear-gradient(180deg,transparent,var(--bg) 28%)}.composer{max-width:994px;margin:auto;border:1px solid var(--line);background:#0f1728f5;border-radius:20px;padding:10px;box-shadow:var(--shadow)}.modes{display:flex;gap:8px;padding:3px 4px 9px}.mode{padding:8px 11px;border:1px solid transparent}.mode.active{border-color:var(--line)}.input-row{display:flex;gap:10px;align-items:flex-end}.prompt{min-height:52px;max-height:180px;resize:none;flex:1;border:0;background:transparent;color:var(--text);padding:14px 12px;outline:none;line-height:1.5}.prompt::placeholder{color:#738099}.send{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.send:disabled{opacity:.45;cursor:not-allowed}.image-options{display:none;gap:10px;align-items:center;padding:0 4px 9px}.image-options.show{display:flex}.image-options label{font-size:12px;color:var(--muted)}select{border:1px solid var(--line);background:var(--panel2);padding:7px 10px;border-radius:9px}.hint{text-align:center;margin-top:8px}.typing{display:flex;gap:5px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}.mobile{display:none}@keyframes in{from{opacity:0;transform:translateY(5px)}}@keyframes pulse{0%,70%,100%{opacity:.35}35%{opacity:1;transform:translateY(-4px)}}@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;inset:0 auto 0 0;width:280px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.top{padding:0 16px}.mobile{display:grid}.composer-wrap{left:0;padding:12px}.messages{padding:24px 16px 150px}.empty h2{font-size:30px}.starters{grid-template-columns:1fr}.desktop{display:none}}
</style>
</head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="mark"><i data-lucide="sparkles" size="20"></i></div><div><strong>Gemini Workspace</strong><span>Chat + image generation</span></div></div><button class="new" id="newChat"><i data-lucide="plus" size="18"></i>New conversation</button><nav class="nav"><button class="active" data-mode="chat"><i data-lucide="message-square" size="18"></i>Chat</button><button data-mode="image"><i data-lucide="image" size="18"></i>Create image</button></nav><section class="history"><h3>Recent prompts</h3><div class="history-list" id="historyList"></div></section><div class="foot"><div class="user"><div class="avatar">K</div><div><strong>Sportomax</strong><span>Saved locally</span></div></div><button class="icon" id="clearHistory" title="Clear history"><i data-lucide="trash-2" size="17"></i></button></div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="icon mobile" id="menuBtn"><i data-lucide="menu"></i></button><div class="title"><h1 id="pageTitle">Chat with Gemini</h1><p id="pageSubtitle">Ask, create, brainstorm, and get things done.</p></div></div><div class="actions"><button class="icon desktop" id="newTop" title="New conversation"><i data-lucide="plus" size="18"></i></button><button class="icon" id="copyChat" title="Copy conversation"><i data-lucide="copy" size="18"></i></button></div></header><section class="workspace"><div class="messages" id="messages"></div></section><div class="composer-wrap"><div class="composer"><div class="modes"><button class="mode active" data-mode="chat"><i data-lucide="message-square" size="16"></i>Chat</button><button class="mode" data-mode="image"><i data-lucide="image" size="16"></i>Image</button></div><div class="image-options" id="imageOptions"><label for="ratio">Aspect ratio</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option></select></div><div class="input-row"><textarea class="prompt" id="prompt" placeholder="Message Gemini…" aria-label="Message Gemini"></textarea><button class="send" id="send" aria-label="Send"><i data-lucide="arrow-up" size="20"></i></button></div></div><div class="hint">Enter to send · Shift + Enter for a new line · Generated images include SynthID</div></div></main></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],messages=$('#messages'),promptEl=$('#prompt'),sendBtn=$('#send'),key='gemini-workspace-v2';let mode='chat',busy=false,conversation=[];const starters=[['Explain something','Explain quantum computing in plain English.'],['Build something','Create a production-ready JavaScript form validator.'],['Brainstorm ideas','Give me five creative board game concepts.'],['Create an image','A cinematic mountain lake at sunset, ultra-detailed.']];
const esc=(s='')=>s.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function empty(){messages.innerHTML=`<div class="empty"><div class="empty-inner"><div class="orb"><i data-lucide="sparkles" size="30"></i></div><h2>What can I help you create?</h2><p>Chat naturally, get polished answers, or switch to Image mode to generate original visuals without exposing your API key.</p><div class="starters">${starters.map(([a,b])=>`<button class="starter" data-prompt="${esc(b)}"><strong>${a}</strong><br><span>${b}</span></button>`).join('')}</div></div></div>`;lucide.createIcons();$$('.starter').forEach(b=>b.onclick=()=>{setMode(b.textContent.includes('image')?'image':'chat');promptEl.value=b.dataset.prompt;promptEl.focus()})}
function add(role,content,opt={}){if(messages.querySelector('.empty'))messages.innerHTML='';const el=document.createElement('div');el.className=`msg ${role==='user'?'user-msg':'assistant'}`;let body=opt.loading?'<div class="typing"><span></span><span></span><span></span></div>':role==='assistant'?marked.parse(content||''):esc(content||'').replace(/\n/g,'<br>');if(opt.imageData)body+=`<img class="generated" src="data:${opt.imageMime};base64,${opt.imageData}" alt="AI-generated image">`;el.innerHTML=`<div class="avatar">${role==='user'?'K':'✦'}</div><div class="bubble">${body}${!opt.loading?`<div class="msg-actions"><button class="small copyOne"><i data-lucide="copy" size="14"></i>Copy</button>${opt.imageData?'<button class="small download"><i data-lucide="download" size="14"></i>Download</button>':''}</div>`:''}</div>`;messages.appendChild(el);lucide.createIcons();el.querySelector('.copyOne')?.addEventListener('click',()=>navigator.clipboard.writeText(content||''));el.querySelector('.download')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=`data:${opt.imageMime};base64,${opt.imageData}`;a.download=`gemini-image-${Date.now()}.${opt.imageMime.includes('png')?'png':'jpg'}`;a.click()});messages.scrollTop=messages.scrollHeight;return el}
function save(){try{localStorage.setItem(key,JSON.stringify(conversation.slice(-30)))}catch(e){console.warn('History could not be saved',e)}renderHistory()}
function load(){try{conversation=JSON.parse(localStorage.getItem(key)||'[]')}catch{conversation=[]}if(!conversation.length){empty();renderHistory();return}messages.innerHTML='';conversation.forEach(m=>add(m.role,m.content,{imageData:m.imageData,imageMime:m.imageMime}));renderHistory()}
function renderHistory(){const items=conversation.filter(x=>x.role==='user').slice(-8).reverse();$('#historyList').innerHTML=items.length?items.map(x=>`<button class="history-item">${esc(x.content)}</button>`).join(''):'<div class="sub" style="padding:10px 12px">No prompts yet</div>'}
function setMode(next){mode=next;$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));$('#imageOptions').classList.toggle('show',next==='image');$('#pageTitle').textContent=next==='image'?'Create an image':'Chat with Gemini';$('#pageSubtitle').textContent=next==='image'?'Describe it clearly, then download the result.':'Ask, create, brainstorm, and get things done.';promptEl.placeholder=next==='image'?'Describe the image you want…':'Message Gemini…';$('#sidebar').classList.remove('open');promptEl.focus()}
async function submit(){const text=promptEl.value.trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;promptEl.value='';add('user',text);conversation.push({role:'user',content:text});const loading=add('assistant','',{loading:true});try{const payload=mode==='image'?{mode:'image',prompt:text,aspectRatio:$('#ratio').value}:{mode:'chat',message:text,history:conversation.slice(-12)};const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();loading.remove();if(!res.ok)throw new Error(data.error||data.reply||'Request failed');const msg={role:'assistant',content:data.text||data.reply||'',imageData:data.image?.data,imageMime:data.image?.mimeType};add('assistant',msg.content,msg);conversation.push(msg);save()}catch(err){loading.remove();const msg=`Sorry, that failed: ${err.message}`;add('assistant',msg);conversation.push({role:'assistant',content:msg});save()}finally{busy=false;sendBtn.disabled=false;promptEl.focus()}}
promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});sendBtn.onclick=submit;$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function reset(){conversation=[];localStorage.removeItem(key);empty();renderHistory();setMode('chat')}$('#newChat').onclick=reset;$('#newTop').onclick=reset;$('#clearHistory').onclick=()=>confirm('Clear your saved local chat history?')&&reset();$('#copyChat').onclick=()=>navigator.clipboard.writeText(conversation.map(x=>`${x.role.toUpperCase()}: ${x.content}`).join('\n\n'));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');load();lucide.createIcons();
</script></body></html>
